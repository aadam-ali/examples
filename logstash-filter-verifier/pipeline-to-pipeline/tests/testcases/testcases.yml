input_plugin: one_input_stdin_0
ignore:
  - '@timestamp'
testcases:
  - description: Foo Logs
    input:
      - >
        {
          "message": "hi",
          "service": "foo"
        }

    expected:
      - message: hi
        service: foo
      - message: hi
        service: foo
        pipeline: two

  - description: Bar Logs
    input:
      - >
        {
          "message": "hi",
          "service": "bar"
        }

    expected:
      - message: hi
        service: bar
      - message: hi
        service: bar
        pipeline: three
